
name: Update Kabar Ummah

on:
  schedule:
    - cron: '37 * * * *'
      timezone: Asia/Jakarta

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kabar-ummah
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Mengambil kode terbaru dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Menyiapkan Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Menginstal dependensi
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Menjalankan pengambilan dan pemrosesan berita
      - name: Fetch Islamic News
        run: |
          python -u aggregator/main.py

      # 5. Memastikan news.json valid sebelum commit
      - name: Validate News JSON
        run: |
          python - <<'PY'
          import json
          import os

          path = "data/news.json"

          if not os.path.exists(path):
              raise SystemExit("ERROR: data/news.json tidak ditemukan!")

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              raise SystemExit(f"ERROR: news.json tidak valid: {e}")

          if not isinstance(data, dict):
              raise SystemExit("ERROR: Format news.json harus berupa object!")

          if not isinstance(data.get("articles"), list):
              raise SystemExit("ERROR: Properti articles tidak ditemukan atau bukan list!")

          if not data["articles"]:
              raise SystemExit("ERROR: Daftar berita kosong. Commit dibatalkan!")

          print(f"Validasi berhasil: {len(data['articles'])} berita.")
          PY

      # 6. Commit hanya jika ada perubahan
      - name: Commit Updated News
        run: |
          git config user.name "Kabar Ummah Bot"
          git config user.email "bot@users.noreply.github.com"

          git add data/news.json

          if [ -f data/translation_cache.json ]; then
            git add data/translation_cache.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update Kabar Ummah news"
            git push
          else
            echo "Tidak ada perubahan berita."
          fi
