name: Update Kabar Ummah

on:
  schedule:
    - cron: '37 * * * *'
      timezone: Asia/Jakarta

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kabar-ummah
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Fetch Islamic News
        run: python aggregator/main.py

      - name: Commit Updated News
        run: |
          git config user.name "Kabar Ummah Bot"
          git config user.email "bot@users.noreply.github.com"

          git add data/news.json
          git add data/translation_cache.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Kabar Ummah news"
            git push
          else
            echo "Tidak ada perubahan berita."
          fi
